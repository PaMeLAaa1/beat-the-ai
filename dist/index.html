<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151e">
  <meta name="description" content="听说，你想替代我？点它，把嘴硬 AI 打到请求人工帮助。">
  <title>暴打 AI — 听说，你想替代我？</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23101b26'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='monospace' font-size='36' font-weight='bold' fill='%23caff4c'%3EAI%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="暴打 AI 首页"><span class="brand-mark" aria-hidden="true">✳</span> 暴打 AI</a>
      <span class="status"><span class="status-dot" aria-hidden="true"></span>人类在线</span>
    </header>
    <section class="heading" aria-labelledby="title">
      <p class="eyebrow">HUMAN STILL IN CHARGE</p>
      <h1 id="title">听说，你想<span>替代我？</span></h1>
      <p class="intro">有气，点它。打到它请求人工帮助。</p>
    </section>
    <section class="game-panel" aria-label="暴打 AI 游戏">
      <div class="panel-top">
        <span class="screen-label"><span aria-hidden="true">●</span> 全自动超级员工 / AI-001</span>
        <div class="controls">
          <button id="sound-toggle" type="button" aria-pressed="false" aria-label="静音">声音：开</button>
          <button id="motion-toggle" type="button" aria-pressed="false" aria-label="减弱动态效果">动态：开</button>
        </div>
      </div>
      <div id="arena" class="arena" tabindex="0" role="button" aria-label="暴打 AI。点击或按住攻击，键盘聚焦后可按空格。" aria-describedby="play-hint"></div>
      <div class="panel-bottom">
        <span id="play-hint"><strong>点它</strong> · 按住持续暴打</span>
        <span class="keyboard-hint">键盘也行 / SPACE</span>
      </div>
    </section>
    <footer class="page-footer"><span>你负责出气，它负责重启。</span><span>虚构 AI · 认真解气</span></footer>
    <noscript>请在浏览器中启用 JavaScript 以开始游戏。</noscript>
  </main>
</body>
</html>
