name: Verify game
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - name: Check HTTP entry point
        shell: bash
        run: |
          node scripts/serve.mjs > /tmp/beat-the-ai-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /tmp/beat-the-ai-index.html; then break; fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:3000/app.js > /dev/null
          curl --fail --silent http://127.0.0.1:3000/styles.css > /dev/null
          node -e "const html=require('node:fs').readFileSync('/tmp/beat-the-ai-index.html','utf8'); if(!html.includes('暴打 AI') || !html.includes('./app.js')) process.exit(1)"
      - name: Browser smoke and screenshots
        if: matrix.node == '22'
        run: node scripts/browser-smoke.mjs
      - name: Save browser screenshots
        if: always() && matrix.node == '22'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-screenshots
          path: .artifacts/*.png
          include-hidden-files: true
          if-no-files-found: error
